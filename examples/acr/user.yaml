# Your ACR config, at ~/.config/acrbus/acr.yaml. Only this file says how
# models are reached: which bridge agent, which of its models, with which
# tools. A repository chooses among these names. acrbus assumes no provider,
# model or binding of its own, so everything here is an example: set your own.
# ACR runs on one machine: every agent here must be on the machine with the
# code. Reviewers that can run things each work in a copy of their own.
version: 1
allowed_bindings:
  small:
    agent: models@my-mac
    model: example/small-model
    tools: [read, grep, glob]
  medium:          # reviewers; add bash, write and edit for probes, which are on
    agent: models@my-mac  # by default and run in a copy of each reviewer's own
    model: example/medium-model
    effort: high
    tools: [read, grep, glob]
  large:
    agent: models@my-mac
    model: example/large-model
    effort: medium
    tools: [read, grep, glob]
    writes: true    # the Orchestrator may apply fixes, in the repository
defaults:
  human_gate: in-the-loop
  # Every role needs a binding, here or in the repository's config.
  bindings:
    sizer: small
    reviewer: medium
    orchestrator: large
    judge: large
