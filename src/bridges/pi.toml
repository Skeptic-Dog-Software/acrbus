# acrbus's defaults for a pi bridge, `kind = "pi"`: headless pi, a fresh
# session for each request, with none of your extensions, skills, prompt
# templates or themes, and no project-local config trusted. A bridge's own
# table in config.toml holds what's this machine's: owner, command, home,
# path, working_directory, model, its provider's models, and extra_args.
# Anything it sets wins over these.
args = ["-p", "--model", "{MODEL}", "--session-dir", "{SESSION_DIR}", "--no-extensions",
  "--no-skills", "--no-prompt-templates", "--no-themes", "--no-approve"]
# 4 hours: a cap no review should ever reach. A run ends when it's done.
timeout_secs = 14400
max_concurrent = 3

[options]
max_timeout_secs = 14400
tools = ["read", "bash", "edit", "write", "grep", "find", "ls"]
tools_args = ["--tools", "{TOOLS}"]
no_tools_args = ["--no-tools", "--no-mcp"]
efforts = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]
effort_args = ["--thinking", "{EFFORT}"]
workdirs = []

[usage]
files = "**/*.jsonl"
when = { type = "message", "message.role" = "assistant" }
input = "message.usage.input"
output = "message.usage.output"
cache_read = "message.usage.cacheRead"
cache_write = "message.usage.cacheWrite"
usd = "message.usage.cost.total"
model = "message.model"
